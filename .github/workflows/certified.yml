# Publish a certified driver: build it, put the payload somewhere a controller can read, and
# index it.
#
# The publishing half of driver CI. `driver.yml` beside it does the build and needs no
# credentials at all; this one adds the step that puts a row in the registry's index.
#
# **What makes a driver certified is `REGISTRY_TOKEN`, not this file.** The token is an
# organisation secret on junohouse, so only a repository inside the organisation inherits one,
# and the registry accepts a dispatch from nothing else. Anyone may read this workflow and
# anyone may call it; without the token the last step gets a 401 and the index is untouched.
#
# This used to live in the private registry repo, on the theory that a workflow nobody can see
# cannot be called. That is true and it is also unusable: a **public** repository cannot call a
# reusable workflow stored in a private one, whatever the repository's access setting says, and
# every certified driver repo is public. The privacy was belt-and-braces over a gate that was
# already doing the work.
#
# A driver repo's own workflow is:
#
#   name: release
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#   jobs:
#     driver:
#       uses: junohouse/driver-ci/.github/workflows/certified.yml@main
#       permissions:
#         contents: write
#       secrets: inherit
name: certified

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          JSON array of package directories, each holding a manifest.toml. Defaults to the
          repo root.
        type: string
        default: '["."]'
      sdk-ref:
        description: Branch of junohouse/driver-sdk to validate and package against.
        type: string
        default: main
      registry-repo:
        type: string
        default: junohouse/registry
      stamp-property:
        description: >-
          Passed through to the build. Names a manifest `[[property]]` whose `default` receives
          the `VENDOR_KEY` secret at package time — see driver-ci's README.
        type: string
        default: ''
      payload:
        description: >-
          Where a controller downloads the package from.

          `releases` — the driver's own GitHub releases. Correct while the repo is public, and
          the default, because it is one less moving part and one less thing to pay for.

          `r2` — object storage on a public host. What a **private** driver repo needs: a
          release asset there requires a token to download, and a controller in a house has
          none and must never need one. Nothing else about the pipeline changes; this is the
          one step that decides where the bytes live, and the index carries whatever URL it is
          handed. Needs the Cloudflare setup in this repo's README first.
        type: string
        default: releases
      bucket:
        description: R2 bucket holding driver payloads. Only read when `payload` is `r2`.
        type: string
        default: juno-drivers
      payload-host:
        description: >-
          Public origin that bucket is served from. Only read when `payload` is `r2`.
        type: string
        default: https://dl.juno.house
    secrets:
      REGISTRY_TOKEN:
        description: Dispatch into the registry.
        required: true
      VENDOR_KEY:
        description: Passed through to the build. Required only when `stamp-property` is set.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: Write access to the R2 bucket. Required only when `payload` is `r2`.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  # The build, beside this file. Relative rather than `junohouse/driver-ci/...@main`, so a
  # branch of this repo tests its own build workflow rather than main's.
  #
  # It publishes to the driver's own releases unless something else is about to host the
  # payload instead.
  build:
    uses: ./.github/workflows/driver.yml
    permissions:
      contents: write
    with:
      packages: ${{ inputs.packages }}
      sdk-ref: ${{ inputs.sdk-ref }}
      stamp-property: ${{ inputs.stamp-property }}
      release: ${{ inputs.payload == 'releases' }}
    secrets:
      VENDOR_KEY: ${{ secrets.VENDOR_KEY }}

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Every package the build produced, each in its own directory: the `.junodrv`, its
      # digest, and the `meta.json` describing it. Not merged, because two packages from one
      # repo have two of each and merging them would collide on meta.json.
      - uses: actions/download-artifact@v6
        with:
          pattern: pkg-*
          path: ${{ runner.temp }}/packages

      - uses: dtolnay/rust-toolchain@stable
      - name: Install the packager
        run: |
          cargo install --locked --features pack \
            --git https://github.com/junohouse/driver-sdk --branch '${{ inputs.sdk-ref }}' driver-sdk

      # Whether this driver's source can be read, asked of GitHub rather than declared
      # anywhere. A flag in a manifest would say what somebody believed on the day they wrote
      # it; this says what is true at the moment the artifact is published, which is what the
      # catalog is about to tell a person.
      - name: Is this repository readable
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)
          [ "$private" = true ] && echo 'source=closed' >> "$GITHUB_OUTPUT" \
                                || echo 'source=open'   >> "$GITHUB_OUTPUT"

      # Only for a repo whose releases a controller cannot read. Keyed by repository and
      # filename, so two drivers cannot collide and a build is never overwritten by a
      # different build of the same version.
      - name: Upload the payloads to R2
        if: inputs.payload == 'r2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for dir in "$RUNNER_TEMP"/packages/pkg-*; do
            artifact=$(jq -r .artifact "$dir/meta.json")
            key="p/$GITHUB_REPOSITORY/$artifact"

            npx --yes wrangler@4 r2 object put "${{ inputs.bucket }}/$key" \
              --file "$dir/$artifact" --content-type application/zip --remote
            npx --yes wrangler@4 r2 object put "${{ inputs.bucket }}/$key.sha256" \
              --file "$dir/$artifact.sha256" --content-type text/plain --remote

            echo "uploaded $key"
          done

      # The registry never parses a manifest. `junodrv entry` reads the archive that actually
      # shipped and emits the index rows for every driver inside it — so a package carrying a
      # bridge and its bulbs registers both, and there is exactly one TOML parser in the
      # system rather than a second one in the registry drifting away from core's.
      - name: Tell the registry
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DESC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          description=$(GH_TOKEN="$DESC_TOKEN" gh repo view "$GITHUB_REPOSITORY" \
                          --json description -q .description)

          for dir in "$RUNNER_TEMP"/packages/pkg-*; do
            artifact=$(jq -r .artifact "$dir/meta.json")
            tag=$(jq -r .tag "$dir/meta.json")

            # Where the payload actually went. Reconstructed rather than passed back from the
            # build, because that is a matrix and a matrix job's outputs keep only the last
            # leg — which is also why the tag travels in meta.json, decided once beside the
            # version rather than twice.
            if [ '${{ inputs.payload }}' = r2 ]; then
              url="${{ inputs.payload-host }}/p/$GITHUB_REPOSITORY/$artifact"
            else
              url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$artifact"
            fi

            junodrv entry "$dir/$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --url "$url" \
              --sha256 "$(jq -r .sha256 "$dir/meta.json")" \
              --version "$(jq -r .version "$dir/meta.json")" \
              --source '${{ steps.vis.outputs.source }}' \
              --description "$description" \
              > "$dir/entries.json"

            jq -n \
              --arg channel "$(jq -r .channel "$dir/meta.json")" \
              --slurpfile entries "$dir/entries.json" \
              '{event_type: "driver-published",
                client_payload: {channel: $channel, entries: $entries[0]}}' \
              | gh api "repos/${{ inputs.registry-repo }}/dispatches" --input -
          done
