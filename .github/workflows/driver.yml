# Build, validate and package a Juno driver. Public, and needs no credentials.
#
# Doing the build here rather than in each driver repo is the point: the validation step cannot
# be skipped by a driver author in a hurry. A driver repo's own workflow is six lines and has no
# logic in it — which is also why its Actions page is readable: one run, one job list, no matrix
# to decode. It depends only on driver-sdk, which is public, so a third party writing their own
# driver gets exactly the build and exactly the validation a first-party driver gets.
#
# What it deliberately does NOT do is touch the registry. Indexing a driver as *certified* is a
# claim about provenance, and a workflow anyone can call cannot make that claim about itself.
# That step lives in `certified.yml` in the private registry repo, which calls this file for the
# build — and which, being private, can only be called from inside the organisation.
#
# Two channels, decided by what triggered the run:
#
#   push to a v* tag  ->  stable   ->  release v1.2.0
#   push to a branch  ->  beta     ->  rolling `beta` prerelease
#
# A beta version is the manifest's version with a prerelease suffix (1.2.0-beta.41), which
# sorts *below* 1.2.0 under semver. A controller on the stable channel therefore cannot be
# offered a beta by accident even if the two indexes were merged by mistake.
name: driver

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          JSON array of package directories, each holding a manifest.toml. Defaults to the
          repo root. A repo ships more than one when it has drivers that share no control
          code — Caséta's telnet and LEAP paths, say.
        type: string
        default: '["."]'
      sdk-ref:
        description: >-
          Branch of junohouse/driver-sdk to validate and package against. The contracts live
          there, so this is what a driver is checked against — and it is public, which is the
          whole point: nothing here needs read access to a private repository any more.

          A branch rather than a tag, and `main` rather than a pinned one. This defaulted to
          v0.5.0 while the SDK was at 0.13, so a contract added on main was invisible here and
          a driver declaring a capability that plainly existed failed certification saying it
          did not. That is the same trade core's own Cargo.toml describes giving up on: "a
          contract change that missed a tag, a consumer that would not compile because of it".
          Pass a ref explicitly to pin one build.
        type: string
        default: main
      release:
        description: >-
          Publish the package to this repository's own releases, which is how a public driver
          is distributed. Turn it off when something downstream is doing the publishing — the
          certified pipeline puts payloads on a host a controller can read without a token.
        type: boolean
        default: true
      stamp-property:
        description: >-
          Name of a manifest `[[property]]` whose `default` should receive the `VENDOR_KEY`
          secret at package time. Empty, and nothing is stamped.

          For an integration key that belongs to the vendor rather than to a house — Sonos
          issues one per integration, not one per household. It goes in here rather than in
          the driver's source so the build job stays credential-free, so rotating it is a
          repackage rather than a recompile, and so it is never committed to a public repo.

          It is obfuscation, not a secret: the artifact is downloadable and anyone can read a
          string out of it. The property exists so a house can set its own instead.
        type: string
        default: ''
    secrets:
      VENDOR_KEY:
        description: Stamped into `stamp-property`. Required only when that input is set.
        required: false
    outputs:
      channel:
        description: stable or beta, from what triggered the run.
        value: ${{ jobs.publish.outputs.channel }}

# Two builds of the same commit must not race to publish the same tag.
concurrency:
  group: driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------------------
  # One job per package per platform. A driver is a native library, so "build once" is not
  # available to us: a controller is macOS in some houses and Linux in others, and Linux is as
  # often ARM as x86 — a small box in a cupboard, or this project's own container on Apple
  # silicon. A package missing a platform fails at install time on that platform, which is the
  # worst place to find out, and the failure reads as a broken driver rather than a missing
  # build. Architecture is in the payload's name for the same reason: an x86-64 and an aarch64
  # `.so` are both `.so`, and handing over the wrong one fails at dlopen saying nothing useful.
  # -------------------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
        target:
          - { os: macos-14,         payload: driver-macos-aarch64.dylib }
          - { os: ubuntu-latest,    payload: driver-linux-x86_64.so }
          - { os: ubuntu-24.04-arm, payload: driver-linux-aarch64.so }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v5

      # An artifact name cannot contain a slash, and a package directory can. Slugged once
      # here so the upload and the download in `publish` agree on the name.
      - name: Name this package
        run: echo "SLUG=$(echo '${{ matrix.package }}' | tr '/.' '--')" >> "$GITHUB_ENV"

      # No credentials here on purpose. A driver depends only on driver-sdk, which is
      # public and depends on nothing of ours, so building one needs no access to anything —
      # which is what makes a driver something an outsider can build and check for themselves.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.package }}

      # Ask cargo where it put the library rather than guessing a path. A repo shipping more
      # than one package shares a workspace `target/` at the repo root, so the artifact is
      # *not* under the package directory — and searching the shared directory by extension
      # would happily pick up a sibling package's driver instead of this one's.
      #
      # The result is renamed to the flat `driver.<ext>` the package format expects. The two
      # platforms have different extensions, so both sit in one archive without colliding and
      # the controller picks the one it can actually load.
      - name: Build and collect the library
        working-directory: ${{ matrix.package }}
        run: |
          cargo build --release --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/build.json"

          ext='${{ matrix.target.payload }}'; ext="${ext##*.}"
          lib=$(jq -r 'select(.reason == "compiler-artifact")
                       | select(.target.kind[]? == "cdylib")
                       | .filenames[]?' "$RUNNER_TEMP/build.json" \
                | grep "\\.$ext$" | tail -1)

          if [ -z "$lib" ]; then
            echo "::error::cargo built no .$ext for ${{ matrix.package }} — is crate-type = [\"cdylib\"] set?"
            exit 1
          fi
          echo "collected $lib"
          cp "$lib" "$RUNNER_TEMP/${{ matrix.target.payload }}"

      - uses: actions/upload-artifact@v5
        with:
          name: lib-${{ env.SLUG }}-${{ matrix.target.payload }}
          path: ${{ runner.temp }}/${{ matrix.target.payload }}
          if-no-files-found: error

  # -------------------------------------------------------------------------------------
  # Validate, package, and hand the result on. One job per package, after every platform for
  # it has been built.
  #
  # The packed `.junodrv` leaves here as a workflow artifact whether or not it is released,
  # because that is the seam the certified pipeline picks it up from. A matrix job cannot
  # usefully return per-package outputs — GitHub keeps only the last one — so the metadata
  # travels beside the payload as a file instead.
  # -------------------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@v5

      - name: Name this package
        run: echo "SLUG=$(echo '${{ matrix.package }}' | tr '/.' '--')" >> "$GITHUB_ENV"

      - name: Work out the channel and the version
        id: meta
        run: |
          # One driver lives in manifest.toml; several live in manifests/. They share a
          # version — one artifact cannot claim two versions of itself — so any of them
          # answers the question, and disagreement between them is caught below.
          pkg='${{ matrix.package }}'
          versions=$(cat "$pkg"/manifest.toml "$pkg"/manifests/*.toml 2>/dev/null \
                     | grep '^version' | cut -d'"' -f2 | sort -u)
          declared=$(echo "$versions" | head -1)

          if [ -z "$declared" ]; then
            echo "::error::$pkg declares no drivers: expected manifest.toml or manifests/*.toml"
            exit 1
          fi
          if [ "$(echo "$versions" | wc -l)" -gt 1 ]; then
            echo "::error::$pkg's manifests disagree on the version: $(echo $versions)"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag names a version, so the manifest disagreeing with it is a mistake worth
            # stopping for: the artifact is about to be published under the tag's name.
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$tagged" ]; then
              echo "::error::manifest.toml says $declared but the tag says $tagged"
              exit 1
            fi
            echo "channel=stable"        >> "$GITHUB_OUTPUT"
            echo "version=$declared"     >> "$GITHUB_OUTPUT"
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            # Sorts below the release it is a preview of, so a stable controller can never
            # resolve to it. run_number rather than the sha so betas order by recency.
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=$declared-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release=beta" >> "$GITHUB_OUTPUT"
          fi

      # Everything this job needs — the proxy contracts, the manifest format, the archive
      # layout and the index row — is in driver-sdk, which is public. It used to check out the
      # controller for them, which meant every certified driver's CI carried a token for a
      # private repository it has nothing to do with, and made "anyone can build a driver"
      # false the moment somebody wanted to validate one.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the packager
        run: |
          cargo install --locked --features pack \
            --git https://github.com/junohouse/driver-sdk --branch ${{ inputs.sdk-ref }} driver-sdk

      - uses: actions/download-artifact@v6
        with:
          pattern: lib-${{ env.SLUG }}-*
          path: ${{ runner.temp }}/libs
          merge-multiple: true

      - name: Stage the payloads beside the manifest
        run: cp ${{ runner.temp }}/libs/driver-* '${{ matrix.package }}/'

      # The key never goes near the build job, which is credential-free on purpose — it is
      # written into the manifest here, where the secrets already are. So rotating it is a
      # repackage rather than a recompile, and no source change at all.
      - name: Stamp the vendor key
        if: inputs.stamp-property != ''
        env:
          PKG: ${{ matrix.package }}
          PROP: ${{ inputs.stamp-property }}
          KEY: ${{ secrets.VENDOR_KEY }}
        run: |
          # No key yet is a real state, not a mistake: a driver ships before its vendor
          # account exists, and the manifest marks the property `required` so a household
          # reads as "not set up" rather than as one that quietly never connects. Warn and
          # carry on, and start stamping by itself the day the secret appears.
          if [ -z "$KEY" ]; then
            echo "::warning::VENDOR_KEY is empty, so '$PROP' ships unset. Installers must \
          supply their own. Set it as an organization secret to stamp one in."
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, sys

          pkg, prop, key = os.environ["PKG"], os.environ["PROP"], os.environ["KEY"]
          root = pathlib.Path(pkg)
          files = sorted(root.glob("manifests/*.toml")) or [root / "manifest.toml"]

          stamped = 0
          for f in files:
              lines, out, in_block, done = f.read_text().splitlines(), [], False, False
              for line in lines:
                  s = line.strip()
                  # A new table ends whatever block we were in.
                  if s.startswith("[") and not s.startswith("[["):
                      in_block = False
                  elif s == "[[property]]":
                      in_block = False
                  if s == f'name = "{prop}"':
                      in_block = True
                  # Replace an existing default inside the matched block rather than adding a
                  # second one — TOML takes the first and the edit would silently do nothing.
                  if in_block and s.startswith("default ="):
                      continue
                  out.append(line)
                  if in_block and s == f'name = "{prop}"':
                      out.append(f'default = "{key}"')
                      stamped += 1
                      done = True
              if done:
                  f.write_text("\n".join(out) + "\n")

          if stamped != 1:
              sys.exit(f"expected exactly one `{prop}` property to stamp, found {stamped}")
          print(f"stamped `{prop}` in {pkg}")
          PY

      # The key belongs in the manifest, which is data. A copy compiled into the library is a
      # second one nobody can rotate — and the whole point of stamping is that there is one
      # place to change it. Catches the day somebody "simplifies" it back into the Rust.
      - name: The key is not in the compiled library
        if: inputs.stamp-property != ''
        env:
          PKG: ${{ matrix.package }}
          KEY: ${{ secrets.VENDOR_KEY }}
        run: |
          # An empty needle matches every line of every file, so without this the scan fails
          # every build that has no key to look for.
          if [ -z "$KEY" ]; then
            echo "no key to look for"
            exit 0
          fi
          for lib in "$PKG"/driver-*; do
            [ -f "$lib" ] || continue
            if grep -qF -- "$KEY" "$lib"; then
              echo "::error::$lib contains the vendor key. It belongs in the manifest \
          property, not in the source — see the stamp-property input."
              exit 1
            fi
          done
          echo "no compiled copy of the key"

      # `pack` validates the manifest against the proxy contracts and refuses to write an
      # archive it would not install, so this is the certification step and the build step at
      # once — there is no way to publish while skipping it.
      - name: Validate and package
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          out=$(junodrv pack '${{ matrix.package }}' --out "$RUNNER_TEMP/dist")
          echo "$out"
          built=$(find "$RUNNER_TEMP/dist" -name '*.junodrv' -print -quit)

          name="${GITHUB_REPOSITORY##*/}"
          [ '${{ matrix.package }}' = '.' ] || name="$name-$(basename '${{ matrix.package }}')"
          artifact="$name-${{ steps.meta.outputs.version }}.junodrv"

          mv "$built" "$RUNNER_TEMP/out/$artifact"
          cd "$RUNNER_TEMP/out"
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          echo "$sha  $artifact" > "$artifact.sha256"

          # Beside the payload rather than as a job output: this job is a matrix, and a matrix
          # job's outputs are overwritten by whichever leg finishes last.
          jq -n --arg package '${{ matrix.package }}' \
                --arg artifact "$artifact" \
                --arg sha256 "$sha" \
                --arg version '${{ steps.meta.outputs.version }}' \
                --arg channel '${{ steps.meta.outputs.channel }}' \
                --arg tag '${{ steps.meta.outputs.release }}' \
                '$ARGS.named' > meta.json

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"        >> "$GITHUB_OUTPUT"

      # The packed archive and its metadata, for whatever runs next. A third-party driver stops
      # at the release below; the certified pipeline downloads this and publishes it somewhere
      # a controller can reach without a token.
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ env.SLUG }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

      # A beta is a rolling prerelease: the tag moves to the commit being built, so the
      # "latest beta" link never goes stale and old betas do not pile up.
      - name: Publish to this repo's releases
        if: inputs.release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.meta.outputs.release }}'
          pkg='${{ matrix.package }}'

          if [ '${{ steps.meta.outputs.channel }}' = beta ]; then
            # Each package rolls its own beta. A repo shipping two of them runs this job
            # twice at once, and one shared rolling release means the two race to delete and
            # recreate it — with whichever deleted last dropping the other's artifact.
            title="Beta (${GITHUB_SHA:0:7})"
            if [ "$pkg" != '.' ]; then
              tag="beta-$(basename "$pkg")"
              title="Beta: $(basename "$pkg") (${GITHUB_SHA:0:7})"
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title "$title" \
              --notes "Built from ${GITHUB_SHA:0:7}. Unreviewed — install for testing only."
          else
            # Pushing a tag does not create a release, so the first package to get here makes
            # one and the second finds it and adds its artifact alongside. Both packages of a
            # repo share the version tag, which is right: they were released together.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                   --title "$tag" --notes "Certified build of $GITHUB_REPOSITORY." \
                   2>/dev/null || true
          fi

          gh release upload "$tag" \
            "$RUNNER_TEMP/out/${{ steps.pack.outputs.artifact }}" \
            "$RUNNER_TEMP/out/${{ steps.pack.outputs.artifact }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
